
name: Weekly WA Reminder

on:
  # cron isn't reliable
  # schedule:
  #   # Runs at 00:00 (midnight) UTC every Friday
  #   - cron: '44 21 * * 5'

  # Allows for manual trigger or external API trigger
  workflow_dispatch:

jobs:
  run-api-call:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the code so the runner can see script.sh
      - name: Checkout repository code
        uses: actions/checkout@v4

      # Step 2: Make the script executable and run it
      - name: Execute Bash Script
        env:
          # Pulls the secret token securely from your GitHub Repository Secrets
          EB_TOKEN: ${{ secrets.EB_TOKEN }}
          EB_USERNAME: ${{ vars.EB_USERNAME }}
          WA_RECIPIENTS: ${{ vars.WA_RECIPIENTS }}
          WA_MSG: ${{ vars.WA_MSG }}          
          WA_SUBJECT: ${{ vars.WA_SUBJECT }}
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}

        run: |
          chmod +x ./script.sh
          ./script.sh
